<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — SmartExpiry</title>
<link rel="stylesheet" href="style1.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0f1e">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dashboard-page">

<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
</div>

<!-- Navbar -->
<nav class="navbar dash-nav">
  <div class="nav-brand">
    <div class="logo-mark">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
        <circle cx="16" cy="16" r="14" stroke="url(#gd)" stroke-width="2"/>
        <path d="M16 8v8l5 3" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
        <defs><linearGradient id="gd" x1="0" y1="0" x2="32" y2="32"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#22c55e"/></linearGradient></defs>
      </svg>
    </div>
    <span class="brand-name">Smart<em>Expiry</em></span>
  </div>
  <div class="nav-right">
    <div class="nav-user" id="navUser"></div>
    <button class="btn-logout" onclick="logout()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </button>
  </div>
</nav>

<!-- Toast container -->
<div id="notify"></div>

<!-- Page header -->
<div class="dash-header">
  <div>
    <h1 class="dash-title">Your Inventory</h1>
    <p class="dash-sub" id="dateDisplay"></p>
  </div>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat-card">
    <div class="stat-icon total-icon">📦</div>
    <div>
      <p class="stat-label">Total Items</p>
      <p class="stat-num" id="total">0</p>
    </div>
  </div>
  <div class="stat-card green-card">
    <div class="stat-icon">🟢</div>
    <div>
      <p class="stat-label">Fresh</p>
      <p class="stat-num" id="fresh">0</p>
    </div>
  </div>
  <div class="stat-card yellow-card">
    <div class="stat-icon">⚠️</div>
    <div>
      <p class="stat-label">Expiring Soon</p>
      <p class="stat-num" id="warning">0</p>
    </div>
  </div>
  <div class="stat-card red-card">
    <div class="stat-icon">🔴</div>
    <div>
      <p class="stat-label">Expired</p>
      <p class="stat-num" id="expired">0</p>
    </div>
  </div>
</div>

<!-- Chart + Add Form Row -->
<div class="dash-main">
  <!-- Chart -->
  <div class="chart-box">
    <h3 class="section-title">Inventory Overview</h3>
    <canvas id="myChart"></canvas>
  </div>

  <!-- Add item form -->
  <div class="add-card">
    <h3 class="section-title">Add New Item</h3>
    <div class="add-form">
      <div class="input-group">
        <label>Product Name</label>
        <div class="input-wrap">
          <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          <input type="text" id="name" placeholder="e.g. Milk, Medicine...">
        </div>
      </div>
      <div class="input-group">
        <label>Expiry Date</label>
        <div class="input-wrap">
          <svg class="input-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <input type="date" id="date">
        </div>
      </div>
      <button class="btn-add" onclick="addItem()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Item
      </button>
    </div>
  </div>
</div>

<!-- Search -->
<div class="search-section">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Search products..." oninput="filterList(this.value)">
  </div>
</div>

<!-- Item list -->
<div class="list-section">
  <h3 class="section-title">All Items</h3>
  <div id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="javas/firebase.js"></script>
<script src="javas/script1.js"></script>
<script>
// Set today's date display
document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

// Show logged in user email
auth.onAuthStateChanged(user => {
  if (user) {
    const el = document.getElementById('navUser');
    if (el) el.textContent = user.email;
  }
});

function logout(){
  auth.signOut().then(() => window.location.href = "login1.html");
}

function filterList(query) {
  const items = document.querySelectorAll('.item');
  items.forEach(item => {
    const name = item.querySelector('.item-name')?.textContent.toLowerCase() || '';
    item.style.display = name.includes(query.toLowerCase()) ? '' : 'none';
  });
}
</script>
</body>
</html>
